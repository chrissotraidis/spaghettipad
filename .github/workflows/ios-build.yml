name: SpaghettiPad iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-safety:
    name: Repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run controller ownership regression
        run: scripts/test-controller-reconnect.sh

      - name: Verify build job limits and early rejection
        run: python3 scripts/test-build-jobs.py

      - name: Keep personal app packages off public CI downloads
        run: python3 scripts/test-workflow-containment.py

      - name: Check assets, history, scripts, patches, and docs
        run: scripts/check-repo-safety.sh

  ios-build:
    name: ROM-free unsigned iPhoneOS app and IPA
    runs-on: macos-15
    timeout-minutes: 120
    needs: repository-safety

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: >-
          brew install cmake ninja pkgconf sdl2 glew nlohmann-json libpng
          libzip tinyxml2 libogg libvorbis opus opusfile sdl2_net ripgrep

      - name: Cache fetched build dependencies
        uses: actions/cache@v6
        with:
          path: |
            build-oracle/_deps
            build-ios/_deps
          key: spaghettipad-ios-${{ runner.os }}-${{ hashFiles('sources.lock.json', '.gitmodules', 'scripts/**') }}

      - name: Reproduce unsigned arm64 iPhoneOS app
        run: scripts/build-ios.sh --device

      - name: Verify palm-tree interpolation identity
        run: python3 scripts/test-palm-tree-interpolation.py

      - name: Verify mod selection and catalog
        run: |
          scripts/test-mod-selection.sh
          scripts/test-mod-catalog.sh

      - name: Package and exercise the signing rejection gate
        run: |
          scripts/package-ios.sh
          if REQUIRE_SIGNED=1 scripts/package-ios.sh; then
            echo "Unsigned CI app unexpectedly passed REQUIRE_SIGNED=1" >&2
            exit 1
          fi

      # The full app contains compiled game code even without a ROM. Compile
      # and package checks stay on the runner; do not upload the personal IPA.
